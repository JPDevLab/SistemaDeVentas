spring.datasource.url=jdbc:h2:mem:e2edb;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=30000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-e2e.sql

spring.h2.console.enabled=false

server.port=${SERVER_PORT:8081}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.auth.enabled=true
app.auth.usuario=${APP_AUTH_USUARIO:admin}
app.auth.clave=${APP_AUTH_CLAVE:admin123}
