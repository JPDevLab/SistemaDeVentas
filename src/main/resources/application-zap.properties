# Perfil aislado para laboratorio y análisis dinámico (OWASP ZAP).
# Usa una base H2 en memoria con datos ficticios; no contiene credenciales reales.
spring.datasource.url=jdbc:h2:mem:zapsecurity;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=30000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-zap.sql

spring.h2.console.enabled=false

management.endpoints.web.exposure.include=health
