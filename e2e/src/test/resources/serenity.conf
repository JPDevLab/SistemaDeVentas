webdriver {
  driver = chrome
  base.url = "http://localhost:8081"
  autodownload = true
  wait.for.timeout = 10000
  timeouts.implicitlywait = 3000
}

chrome {
  switches = [
    "--start-maximized",
    "--disable-gpu",
    "--remote-allow-origins=*",
    "--lang=es",
    "--disable-save-password-bubble",
    "--no-first-run",
    "--no-default-browser-check"
  ]
}
