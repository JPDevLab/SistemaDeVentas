# ET0202 - Analisis pasivo de seguridad con OWASP ZAP.
# Ambiente: Windows + agente self-hosted LocalPool + Docker Desktop.
# Revisar variables del proyecto antes de ejecutar.

trigger: none
pr: none

pool:
  name: LocalPool
  demands:
    - Agent.OS -equals Windows_NT

variables:
  appPort: '8081'
  healthPath: '/actuator/health'
  springProfile: 'zap'
  zapTarget: 'http://host.docker.internal:8081'

steps:
  - checkout: self

  - powershell: |
      $ErrorActionPreference = 'Stop'
      $dir = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'zap'
      $logs = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'logs'
      New-Item -Path $dir -ItemType Directory -Force | Out-Null
      New-Item -Path $logs -ItemType Directory -Force | Out-Null
      Write-Host "Reportes: $dir"
      Write-Host "Logs de la aplicacion: $logs"
    displayName: '01 - Crear carpeta de reportes'

  - powershell: |
      $ErrorActionPreference = 'Stop'
      java -version
      if ($LASTEXITCODE -ne 0) { throw 'Java no disponible.' }
      docker version
      if ($LASTEXITCODE -ne 0) { throw 'Docker no disponible.' }
      $tipo = docker info --format '{{.OSType}}'
      if ($LASTEXITCODE -ne 0 -or $tipo.Trim() -ne 'linux') {
        throw 'Docker Desktop debe ejecutar contenedores Linux.'
      }
      if (-not (Test-Path '.\gradlew.bat')) {
        throw 'No se encontro gradlew.bat en la raiz del repositorio.'
      }
    workingDirectory: '$(Build.SourcesDirectory)'
    displayName: '02 - Verificar prerrequisitos'

  - powershell: |
      $ErrorActionPreference = 'Stop'
      .\gradlew.bat clean test bootJar --no-daemon
      if ($LASTEXITCODE -ne 0) {
        throw 'Gradle no pudo ejecutar pruebas y compilar.'
      }
    workingDirectory: '$(Build.SourcesDirectory)'
    displayName: '03 - Pruebas y compilacion'

  - powershell: |
      $ErrorActionPreference = 'Stop'
      $logs = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'logs'
      New-Item -Path $logs -ItemType Directory -Force | Out-Null
      $libs = Join-Path $env:BUILD_SOURCESDIRECTORY 'build\libs'
      $jar = Get-ChildItem $libs -Filter '*.jar' |
        Where-Object { $_.Name -notlike '*-plain.jar' } |
        Sort-Object LastWriteTime -Descending |
        Select-Object -First 1
      if (-not $jar) { throw 'No se encontro bootJar en build\libs.' }
      $javaExe = 'java.exe'
      if ($env:JAVA_HOME) {
        $candidato = Join-Path $env:JAVA_HOME 'bin\java.exe'
        if (Test-Path -LiteralPath $candidato) { $javaExe = $candidato }
      }
      Write-Host "Java de la aplicacion: $javaExe"
      $out = Join-Path $logs 'aplicacion-salida.log'
      $err = Join-Path $logs 'aplicacion-error.log'
      $args = '-jar "' + $jar.FullName + '"' +
        ' --server.port=$(appPort)' +
        ' --server.address=0.0.0.0' +
        ' --spring.profiles.active=$(springProfile)'
      $proc = Start-Process -FilePath $javaExe -ArgumentList $args `
        -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
      $pidFile = Join-Path $env:BUILD_SOURCESDIRECTORY 'build\app.pid'
      Set-Content -LiteralPath $pidFile -Value $proc.Id -Encoding ascii
      Write-Host "##vso[task.setvariable variable=AppPid]$($proc.Id)"
      $url = 'http://127.0.0.1:$(appPort)$(healthPath)'
      $listo = $false
      for ($i = 1; $i -le 40; $i++) {
        $proc.Refresh()
        if ($proc.HasExited) { break }
        try {
          $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 3
          if ($r.StatusCode -ge 200 -and $r.StatusCode -lt 300) {
            $listo = $true; break
          }
        } catch { Start-Sleep -Seconds 3 }
      }
      if (-not $listo) {
        Get-Content $err -Tail 30 -ErrorAction SilentlyContinue
        throw "La aplicacion no responde correctamente en $url"
      }
      Write-Host "Aplicacion lista: $url"
    displayName: '04 - Iniciar aplicacion y esperar disponibilidad'

  - powershell: |
      $ErrorActionPreference = 'Stop'
      $dir = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'zap'
      $mount = "${dir}:/zap/wrk:rw"
      # host.docker.internal resuelve IPv6 primero en Docker Desktop; forzar IPv4 evita "Network is unreachable".
      docker run --rm `
        --add-host=host.docker.internal:host-gateway `
        -e JAVA_TOOL_OPTIONS="-Djava.net.preferIPv4Stack=true" `
        -v "$mount" ghcr.io/zaproxy/zaproxy:stable `
        zap-baseline.py -t '$(zapTarget)' -m 2 `
        -r reporte-zap.html -J reporte-zap.json -I
      $codigo = $LASTEXITCODE
      $global:LASTEXITCODE = 0
      Write-Host "Codigo ZAP: $codigo"
      if ($codigo -notin @(0, 1, 2)) {
        throw "Fallo operativo de ZAP: $codigo"
      }
      if (-not (Test-Path (Join-Path $dir 'reporte-zap.html'))) {
        throw 'No existe reporte-zap.html'
      }
      if (-not (Test-Path (Join-Path $dir 'reporte-zap.json'))) {
        throw 'No existe reporte-zap.json'
      }
    displayName: '05 - OWASP ZAP Baseline'

  - powershell: |
      $ErrorActionPreference = 'Stop'
      $patron = 'SistemaDeVentas-.*\.jar'
      $puerto = '$(appPort)'

      function Get-AppProcesses {
        @(Get-CimInstance Win32_Process -Filter "Name='java.exe'" `
          -ErrorAction SilentlyContinue |
          Where-Object {
            $_.CommandLine -match $patron -or
            $_.CommandLine -match "--server\.port=$puerto"
          })
      }

      for ($intento = 1; $intento -le 3; $intento++) {
        $app = Get-AppProcesses
        if ($app.Count -eq 0) { break }
        Write-Host "Intento ${intento}: PID $($app.ProcessId -join ', ')"
        foreach ($p in $app) {
          if (-not (Get-Process -Id $p.ProcessId -ErrorAction SilentlyContinue)) {
            continue
          }
          Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
          Start-Sleep -Milliseconds 500
          if (Get-Process -Id $p.ProcessId -ErrorAction SilentlyContinue) {
            & cmd.exe /c "taskkill /F /T /PID $($p.ProcessId) >nul 2>&1"
          }
        }
        Start-Sleep -Seconds 1
      }

      $quedan = Get-AppProcesses
      if ($quedan.Count -gt 0) {
        throw "No se pudieron detener los PID: $($quedan.ProcessId -join ', ')"
      }
      $sigue = Get-NetTCPConnection -LocalPort $puerto -State Listen `
        -ErrorAction SilentlyContinue
      if ($sigue) {
        throw "El puerto $puerto sigue ocupado por PID $($sigue.OwningProcess)"
      }

      $logs = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'logs'
      $dir = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'zap'
      New-Item -Path $dir -ItemType Directory -Force | Out-Null
      foreach ($nombre in @('aplicacion-salida.log', 'aplicacion-error.log')) {
        $origen = Join-Path $logs $nombre
        if (-not (Test-Path -LiteralPath $origen)) { continue }
        try {
          $fs = [System.IO.File]::Open($origen,
            [System.IO.FileMode]::Open,
            [System.IO.FileAccess]::Read,
            [System.IO.FileShare]::None)
          $fs.Close()
          Copy-Item -LiteralPath $origen -Destination $dir -Force
        } catch {
          Write-Host "Log no copiado al artefacto: $nombre"
        }
      }
      Write-Host "Aplicacion detenida; puerto $(appPort) libre."
    condition: always()
    displayName: '06 - Detener aplicacion de laboratorio'

  - task: PublishPipelineArtifact@1
    displayName: '07 - Publicar evidencias'
    condition: succeededOrFailed()
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/zap'
      artifact: 'reporte-seguridad-zap'
      publishLocation: 'pipeline'
